# Keep the free Render deployment warm so judges never hit a cold-start delay.
# Pinging the web service's /api/health goes through the nginx proxy to the
# backend, so ONE request keeps BOTH services awake.
#
# Note: GitHub may delay scheduled runs by several minutes under load, and this
# keeps the instances always-on (which uses more of Render's free monthly hours).
# You can also trigger it by hand from the Actions tab (Run workflow), or disable
# it after judging. For the most reliable warm-up, additionally point a free
# uptime monitor (UptimeRobot / cron-job.org) at the same URL every 5 minutes.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (wakes web + backend)
        run: |
          URL="https://agentguard-web-9b55.onrender.com/api/health"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL") || code=000
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "warm ✔"; exit 0; fi
            sleep 25
          done
          echo "did not reach 200 (instance may still be waking) — not failing the job"
